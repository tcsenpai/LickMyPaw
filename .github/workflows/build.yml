name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15          # Apple Silicon runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build and self-test
        run: |
          swift build -c release
          # headless suites on a throwaway home; they never touch real user data
          .build/release/LickMyPaw --selftest

      - name: Package (DMG + zipped app)
        run: VERSION="${{ steps.ver.outputs.version }}" ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LickMyPaw-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "LickMyPaw ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "**Unsigned build.** Not signed with an Apple Developer ID and not notarized. See the README for how to open it (right-click → Open, or remove the quarantine flag). Apple Silicon only."
