name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Users on macOS 13-15 still run the app, and some bugs only show there (issue #1, Prowl clicks):
  # run the self-tests on macOS 15 too. The assistant compiles out on this SDK, as it would on those Macs.
  test-macos15:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test on macOS 15
        run: |
          swift build -c release
          .build/release/LickMyPaw --selftest

  build:
    runs-on: macos-26          # Apple Silicon; Xcode 26.6 default, needed for FoundationModels (assistant)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build and self-test
        run: |
          swift build -c release
          # headless suites on a throwaway home; they never touch real user data
          .build/release/LickMyPaw --selftest

      - name: Package (DMG + zipped app)
        run: VERSION="${{ steps.ver.outputs.version }}" ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LickMyPaw-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-macos15]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          {
            echo "**Unsigned build.** Not signed with an Apple Developer ID and not notarized. See the README for how to open it (right-click, then Open, or remove the quarantine flag). Apple Silicon only."
            echo
            # the changelog section of this version, without its own heading
            awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "LickMyPaw $VER" --notes-file notes.md
