name: Website

# Publishes site/ to GitHub Pages. The screenshots are shared with the README, so they are copied in at build time.
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          mkdir -p _site/assets/screenshots
          cp assets/screenshots/*.png _site/assets/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
